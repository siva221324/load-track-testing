<div class="drivers-page">
  <div class="page-header">
    <h1>Drivers</h1>
    <button mat-flat-button color="primary" (click)="add()">
      <mat-icon>add</mat-icon>
      Add Driver
    </button>
  </div>

  <div class="toolbar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search by name, phone, or license</mat-label>
      <input matInput #searchInput (keyup.enter)="applySearch(searchInput.value)" />
      <button matSuffix mat-icon-button (click)="applySearch(searchInput.value)" aria-label="Search">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <div class="table-wrap">
    <mat-progress-bar *ngIf="loading()" mode="indeterminate"></mat-progress-bar>

    <table mat-table [dataSource]="data()" matSort (matSortChange)="onSort($event)" class="mat-elevation-z1">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let d">{{ d.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="name">Name</th>
        <td mat-cell *matCellDef="let d">{{ d.name }}</td>
      </ng-container>

      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Phone</th>
        <td mat-cell *matCellDef="let d">{{ d.phone }}</td>
      </ng-container>

      <ng-container matColumnDef="licenseNumber">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="licenseNumber">License #</th>
        <td mat-cell *matCellDef="let d">{{ d.licenseNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="salaryPerTrip">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="salaryPerTrip">Salary/Trip (₹)</th>
        <td mat-cell *matCellDef="let d">{{ d.salaryPerTrip }}</td>
      </ng-container>

      <ng-container matColumnDef="assignedTruck">
        <th mat-header-cell *matHeaderCellDef>Assigned Truck</th>
        <td mat-cell *matCellDef="let d">
          <span *ngIf="d.assignedTruck; else noTruck">{{ d.assignedTruck.truckNumber }}</span>
          <ng-template #noTruck><span class="muted">—</span></ng-template>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-col">Actions</th>
        <td mat-cell *matCellDef="let d" class="actions-col">
          <button mat-icon-button (click)="createLogin(d)" matTooltip="Create login account">
            <mat-icon>person_add</mat-icon>
          </button>
          <button mat-icon-button (click)="edit(d)" aria-label="Edit"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="remove(d)" aria-label="Delete"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-row" [attr.colspan]="displayedColumns.length">No drivers found.</td>
      </tr>
    </table>

    <mat-paginator
      [length]="totalElements()"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 20, 50]"
      [pageIndex]="pageIndex"
      (page)="onPage($event)">
    </mat-paginator>
  </div>
</div>
