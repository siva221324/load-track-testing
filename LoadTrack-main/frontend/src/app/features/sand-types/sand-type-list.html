<div class="sand-types-page">
  <div class="page-header">
    <h1>Sand Types</h1>
    <button mat-flat-button color="primary" (click)="add()">
      <mat-icon>add</mat-icon>
      Add Sand Type
    </button>
  </div>

  <div class="table-wrap">
    <mat-progress-bar *ngIf="loading()" mode="indeterminate"></mat-progress-bar>

    <table mat-table [dataSource]="data()" class="mat-elevation-z1">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let s">{{ s.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let s">{{ s.name }}</td>
      </ng-container>

      <ng-container matColumnDef="pricePerTon">
        <th mat-header-cell *matHeaderCellDef>Price Per Ton (₹)</th>
        <td mat-cell *matCellDef="let s">{{ s.pricePerTon }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-col">Actions</th>
        <td mat-cell *matCellDef="let s" class="actions-col">
          <button mat-icon-button (click)="edit(s)" aria-label="Edit"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="remove(s)" aria-label="Delete"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-row" [attr.colspan]="displayedColumns.length">No sand types found.</td>
      </tr>
    </table>
  </div>
</div>
