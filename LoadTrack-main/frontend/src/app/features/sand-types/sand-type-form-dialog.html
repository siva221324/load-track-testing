<h2 mat-dialog-title>{{ isEdit ? 'Edit Sand Type' : 'Add Sand Type' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="form-content">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g. Fine Sand" />
      <mat-error *ngIf="form.controls.name.hasError('required')">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Price Per Ton (₹)</mat-label>
      <input matInput type="number" step="0.01" min="0.01" formControlName="pricePerTon" />
      <mat-error *ngIf="form.controls.pricePerTon.hasError('required')">Required</mat-error>
      <mat-error *ngIf="form.controls.pricePerTon.hasError('min')">Must be greater than zero</mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-button (click)="cancel()" [disabled]="saving()">Cancel</button>
    <button type="submit" mat-flat-button color="primary" [disabled]="form.invalid || saving()">
      <mat-spinner *ngIf="saving()" diameter="18"></mat-spinner>
      <span *ngIf="!saving()">{{ isEdit ? 'Update' : 'Add' }}</span>
    </button>
  </mat-dialog-actions>
</form>
