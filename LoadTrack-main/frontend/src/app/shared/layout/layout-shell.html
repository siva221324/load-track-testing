<mat-sidenav-container class="shell">
  <mat-sidenav
    #sidenav
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    class="sidenav">
    <div class="brand">
      <mat-icon>local_shipping</mat-icon>
      <span>LoadTrack</span>
    </div>
    <mat-nav-list>
      <a
        mat-list-item
        *ngFor="let link of visibleLinks()"
        [routerLink]="link.route"
        routerLinkActive="active-link"
        (click)="isHandset() && sidenav.close()">
        <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
        <span matListItemTitle>{{ link.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="topbar">
      <button mat-icon-button *ngIf="isHandset()" (click)="sidenav.toggle()" aria-label="Toggle menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="page-title"></span>
      <span class="spacer"></span>
      <span class="user-info" *ngIf="auth.user() as u">
        <mat-icon>account_circle</mat-icon>
        <span class="user-text">{{ u.username }} ({{ u.role }})</span>
      </span>
      <button mat-icon-button (click)="logout()" aria-label="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
